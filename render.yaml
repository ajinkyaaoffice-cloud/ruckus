# Render blueprint: New > Blueprint, point it at this repo, then fill in the secrets it asks for.
services:
  - type: web
    name: ruckus
    runtime: docker
    plan: free # sleeps after 15 idle minutes (open rooms close); "starter" stays awake
    region: singapore # closest to players in South/Southeast Asia
    healthCheckPath: /api/health
    autoDeploy: true
    # rooms are held in memory: never scale past one instance
    numInstances: 1
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
